name: Publish India OTT Calendar
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *' # 08:00 Phoenix time, year-round
    # Backup run (20:13 Phoenix) in case GitHub delays or skips the morning run.
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: india-ott-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test calendar code
        run: python -m unittest discover -s tests -p 'test_india_ott.py' -v
      - name: Generate live ICS
        run: python scripts/generate_india_ott.py --output site/india-ott.ics
      - name: Validate ICS publication
        run: |
          python - <<'PY'
          from pathlib import Path
          data = Path('site/india-ott.ics').read_bytes()
          assert data.startswith(b'BEGIN:VCALENDAR\r\n')
          assert data.endswith(b'END:VCALENDAR\r\n')
          assert data.count(b'BEGIN:VEVENT') >= 3
          assert b'DTSTART;TZID=America/Phoenix:' in data
          print('Published ICS validation passed')
          PY
      - name: Save subscription feed in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/india-ott.ics
          if ! git diff --cached --quiet; then
            git commit -m "Refresh India OTT ICS feed [skip ci]"
            git push origin HEAD:main
          else
            echo "ICS unchanged"
          fi
      - name: Test public ICS subscription endpoint
        run: |
          curl --fail --silent --show-error --location --retry 3 --dump-header /tmp/ott-headers "https://raw.githubusercontent.com/vihari23/Movie-OTT-/main/site/india-ott.ics" --output /tmp/public-ott.ics
          python - <<'PY'
          from pathlib import Path
          data = Path('/tmp/public-ott.ics').read_bytes()
          hdrs = Path('/tmp/ott-headers').read_text()
          if not (data.startswith(b'BEGIN:VCALENDAR\r\n') and data.endswith(b'END:VCALENDAR\r\n')):
              raise ValueError('Public URL does not serve an ICS calendar')
          count = data.count(b'BEGIN:VEVENT')
          if count < 3:
              raise ValueError(f'Public URL has only {count} events')
          print(f'Public subscription URL: HTTP fetch succeeded, {count} events')
          print('Response headers:')
          print('\n'.join(line for line in hdrs.splitlines() if line.lower().startswith(('http/', 'content-type:', 'cache-control:', 'last-modified:'))))
          PY
      - name: Check optional GitHub Pages configuration
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet. Repository ICS subscription remains available."
          fi
      - name: Configure GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
